<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 8 92 84" role="img" aria-label="Horisite">
  <!-- Símbolo do Horisite: o "o" do logotipo oficial (arquivos da equipe, 14/11/2026), redesenhado
       em SVG para ícone e selo: anel aberto à direita em degradê vinho→coral→laranja→amarelo,
       com dois feixes que afinam para a direita. -->
  <defs>
    <linearGradient id="hs-ring" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#7c2433"/>
      <stop offset="0.14" stop-color="#ff5a5f"/>
      <stop offset="0.5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ffe600"/>
    </linearGradient>
    <linearGradient id="hs-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf1f"/>
      <stop offset="1" stop-color="#fff200"/>
    </linearGradient>
  </defs>
  <path fill="url(#hs-ring)" d="M85.3 31.2A40 40 0 1 0 85.3 68.8L66.4 62.6A20 20 0 1 1 66.4 37.4Z"/>
  <path fill="url(#hs-beam)" d="M65.5 37.8 94.4 42.4 94.4 44.6 65.5 47.4Z"/>
  <path fill="url(#hs-beam)" d="M65.5 62.2 94.4 57.6 94.4 55.4 65.5 52.6Z"/>
</svg>
